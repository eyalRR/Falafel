      // =========================================================
      // 10. ANIMATION LOOP
      // =========================================================
      var clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        var dt = Math.min(clock.getDelta(), 0.05);
        var elapsed = clock.getElapsedTime();
        waterUniforms.uTime.value = elapsed;
        for (var ai = 0; ai < ambientMotes.length; ai++) {
          var mt = ambientMotes[ai];
          mt.position.x = mt.userData.baseX + Math.sin(elapsed * 0.7 + mt.userData.phase) * 0.45;
          mt.position.y = mt.userData.baseY + Math.cos(elapsed * 0.9 + mt.userData.phase) * 0.25;
        }
        for (var bi = 0; bi < circlingBirds.length; bi++) {
          var cb = circlingBirds[bi];
          cb.userData.angle += dt * 0.55;
          cb.position.set(
            -4.2 + Math.cos(cb.userData.angle) * cb.userData.radius,
            cb.userData.height + Math.sin(elapsed * 2 + bi) * 0.2,
            -11.0 + Math.sin(cb.userData.angle) * cb.userData.radius
          );
          cb.rotation.z = -cb.userData.angle;
        }
        for (var di = 0; di < kotelDoves.length; di++) {
          var dv = kotelDoves[di];
          if (dovesTriggered) {
            dv.position.y += dv.userData.vy * dt;
            dv.position.x -= dt * 1.1;
            dv.userData.wL.rotation.x = Math.sin(elapsed * 26 + di) * 0.7;
            dv.userData.wR.rotation.x = -Math.sin(elapsed * 26 + di) * 0.7;
            if (dv.position.y > 11) {
              dv.position.y = dv.userData.baseY;
              dv.position.x = 2.8 + di * 1.4;
              if (di === kotelDoves.length - 1) dovesTriggered = false;
            }
          }
        }
        for (var sbi = 0; sbi < distantSailboats.length; sbi++) {
          distantSailboats[sbi].rotation.z = Math.sin(elapsed * 1.6 + sbi) * 0.06;
          distantSailboats[sbi].position.y = 0.15 + Math.cos(elapsed * 1.4 + sbi) * 0.04;
        }
        for (var mi = 0; mi < mistMeshes.length; mi++) {
          mistMeshes[mi].visible = !storyCompleted;
          if (!storyCompleted) {
            mistMeshes[mi].position.x = Math.sin(elapsed * 0.25 + mi * 1.5) * 4.5;
          }
        }

        // Track & scenery scroll speed
        var scrollSpeed = motionMode === 'run' ? 5.2 : (motionMode === 'roll' ? 6.4 : 0.0);
        if (scrollSpeed > 0) {
          sandTex.offset.y -= scrollSpeed * dt * 0.11;
          for (var pi = 0; pi < trackPebbles.length; pi++) {
            trackPebbles[pi].position.z -= scrollSpeed * dt;
            if (trackPebbles[pi].position.z < -18) trackPebbles[pi].position.z += 36;
          }
          for (var si = 0; si < scrollingProps.length; si++) {
            scrollingProps[si].position.z -= scrollSpeed * dt;
            if (scrollingProps[si].position.z < -18) scrollingProps[si].position.z += 32;
          }
        }

        // Free-fall Throw & Bounce physics
        if (isGrabbing) {
          runPhase += dt * 20;
          leftLeg.rotation.x = Math.sin(runPhase) * 0.9;
          rightLeg.rotation.x = -Math.sin(runPhase) * 0.9;
          leftArm.rotation.x = -Math.sin(runPhase) * 0.9;
          rightArm.rotation.x = Math.sin(runPhase) * 0.9;
        } else if (isThrown) {
          charVel.y -= 17.5 * dt;
          characterRoot.position.addScaledVector(charVel, dt);
          bodyCenter.rotation.x += charVel.z * dt * 0.7;

          if (characterRoot.position.x > 3.2 || characterRoot.position.x < -3.2) {
            characterRoot.position.x = THREE.MathUtils.clamp(characterRoot.position.x, -3.2, 3.2);
            charVel.x *= -0.58;
          }
          if (characterRoot.position.z > 3.2 || characterRoot.position.z < -3.2) {
            characterRoot.position.z = THREE.MathUtils.clamp(characterRoot.position.z, -3.2, 3.2);
            charVel.z *= -0.58;
          }
          if (characterRoot.position.y <= 0) {
            characterRoot.position.y = 0;
            if (Math.abs(charVel.y) > 1.8) {
              charVel.y = -charVel.y * 0.5;
              charVel.x *= 0.72;
              charVel.z *= 0.72;
              jellyVelY = -4.2;
              spawnDust(characterRoot.position.x, 0.08, characterRoot.position.z, 7, 0.5);
              playSoftStep();
            } else {
              charVel.set(0, 0, 0);
              isThrown = false;
              jellyVelY = -3.0;
            }
          }
        } else if (characterRoot.position.lengthSq() > 0.002) {
          characterRoot.position.x = THREE.MathUtils.lerp(characterRoot.position.x, 0, dt * 1.4);
          characterRoot.position.z = THREE.MathUtils.lerp(characterRoot.position.z, 0, dt * 1.4);
          characterRoot.position.y = THREE.MathUtils.lerp(characterRoot.position.y, 0, dt * 8);
        }

        // Trapped / Rescued חומוסון animation
        if (storyCompleted) {
          // Loyal following near פלאפלוצ׳יק + excited uncontrollable jumping & spinning!
          // Rests cozily inside the Giant Pita on the bench while happily bouncing & spinning!
          captiveGroup.position.x = THREE.MathUtils.lerp(captiveGroup.position.x, 1.00, dt * 2.5);
          captiveGroup.position.z = THREE.MathUtils.lerp(captiveGroup.position.z, -0.33, dt * 2.5);

          var hop = Math.abs(Math.sin(elapsed * 6.5));
          chickpeaBody.position.y = 0.22 + hop * 0.26;
          chickpeaBody.rotation.y += dt * 8.5; // spins uncontrollably when excited!
          var sq = 1.0 + (hop - 0.5) * 0.25;
          chickpeaBody.scale.set(1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq));
          cpLeftFoot.position.y = -0.17 + Math.sin(elapsed * 18) * 0.03;
          cpRightFoot.position.y = -0.17 - Math.sin(elapsed * 18) * 0.03;
          if (Math.random() < 0.07) {
            spawnSparkles(captiveGroup.position.x, 0.55, captiveGroup.position.z, '#fde047');
          }
        } else if (chumusonReactionTimer > 0) {
          chumusonReactionTimer -= dt;
          chickpeaBody.position.y = 0.24 + Math.abs(Math.sin(elapsed * 14)) * 0.28;
          chickpeaBody.rotation.y += dt * 10;
          shadowCage.rotation.y += dt * 4.5;
        } else {
          // Shy, curious trembling inside the Shadow Cage
          chickpeaBody.position.x = Math.sin(elapsed * 18) * 0.018;
          chickpeaBody.position.y = 0.24 + Math.sin(elapsed * 4.0) * 0.025;
          chickpeaBody.rotation.y = Math.sin(elapsed * 1.6) * 0.35;
          cpLeftFoot.position.y = -0.17 + Math.abs(Math.sin(elapsed * 10)) * 0.02;
          cpRightFoot.position.y = -0.17 + Math.abs(Math.cos(elapsed * 10)) * 0.02;
          shadowCage.rotation.y += dt * 1.4;
          shadowCage.rotation.x = Math.sin(elapsed * 1.8) * 0.15;
        }

        // Stage 4: Crumb King tosses comedic flying crumbs at פלאפלוצ׳יק
        if (!storyCompleted && !isTransitioning && storyStageIdx === 3) {
          crumbThrowTimer += dt;
          if (crumbThrowTimer > 2.6) {
            crumbThrowTimer = 0;
            var cm = new THREE.Mesh(
              new THREE.DodecahedronGeometry(0.13, 0),
              new THREE.MeshStandardMaterial({ color: '#f59e0b', roughness: 0.8 })
            );
            cm.position.copy(crumbKingGroup.position).add(new THREE.Vector3(0, 0.7, 0));
            var dirToHero = characterRoot.position.clone().add(new THREE.Vector3(0, 0.9, 0)).sub(cm.position).normalize();
            scene.add(cm);
            flyingCrumbs.push({ mesh: cm, vel: dirToHero.multiplyScalar(3.4).add(new THREE.Vector3(0, 1.8, 0)), life: 2.5 });
          }
        }
        for (var fci = flyingCrumbs.length - 1; fci >= 0; fci--) {
          var fc = flyingCrumbs[fci];
          fc.life -= dt;
          fc.vel.y -= 4.2 * dt;
          fc.mesh.position.addScaledVector(fc.vel, dt);
          fc.mesh.rotation.x += dt * 6;
          var heroCenter = characterRoot.position.clone().add(new THREE.Vector3(0, 0.95, 0));
          if (fc.mesh.position.distanceTo(heroCenter) < 0.72) {
            triggerJellyImpulse(3.4, fc.vel.x * 0.15, fc.vel.z * 0.15);
            spawnSparkles(fc.mesh.position.x, fc.mesh.position.y, fc.mesh.position.z, '#f59e0b');
            scene.remove(fc.mesh);
            flyingCrumbs.splice(fci, 1);
          } else if (fc.life <= 0 || fc.mesh.position.y < 0) {
            scene.remove(fc.mesh);
            flyingCrumbs.splice(fci, 1);
          }
        }

        // Comedic Crumb King idle & wobble animation
        if (crumbKingGroup.visible) {
          var kAcc = -80 * crumbKingGroup.userData.wobble - 6 * crumbKingGroup.userData.wobbleVel;
          crumbKingGroup.userData.wobbleVel += kAcc * dt;
          crumbKingGroup.userData.wobble += crumbKingGroup.userData.wobbleVel * dt;
          crumbKingGroup.rotation.z = crumbKingGroup.userData.wobble * 0.08;
          crumbKingGroup.position.y = Math.abs(Math.sin(elapsed * 3.2)) * (storyCompleted ? 0.02 : 0.08);
        }

        // Multi-star floating animation & collision check
        if (!storyCompleted && !isTransitioning) {
          var charWorldCenter = characterRoot.position.clone().add(new THREE.Vector3(0, 1.0, 0));
          for (var stIdx = 0; stIdx < stageStars.length; stIdx++) {
            var stItem = stageStars[stIdx];
            if (stItem.collected) continue;
            stItem.mesh.position.y = stItem.basePos.y + Math.sin(elapsed * 3.0 + stIdx * 1.7) * 0.16;
            stItem.mesh.rotation.y += dt * 2.1;
            if (charWorldCenter.distanceTo(stItem.mesh.position) < 1.1) {
              stItem.collected = true;
              stItem.mesh.visible = false;
              starsCollected++;
              chumusonReactionTimer = 1.4;
              applyStageAtmosphere(STORY_STAGES[storyStageIdx]);
              spawnSparkles(stItem.mesh.position.x, stItem.mesh.position.y, stItem.mesh.position.z, STORY_STAGES[storyStageIdx].color);
              playBellChime(523.25 + starsCollected * 110);
              syncStoryUI();
              if (starsCollected >= stageStars.length) {
                completeCurrentStage();
                break;
              }
            }
          }
        }

        // Jump physics
        if (!isGrounded) {
          jumpVel -= 15.5 * dt;
          jumpY += jumpVel * dt;
          if (jumpY <= 0) {
            jumpY = 0;
            jumpVel = 0;
            isGrounded = true;
            jellyVelY = -4.2; // squash on landing
            spawnDust(0, 0.1, 0, 9, 0.65);
            playSoftStep();
          }
        }

        // Character pose per mode
        if (motionMode === 'run') {
          runPhase += dt * 11.5;
          rollAngle = THREE.MathUtils.lerp(rollAngle, 0, dt * 10);
          bodyCenter.rotation.x = THREE.MathUtils.lerp(bodyCenter.rotation.x, 0.12, dt * 8);

          var bob = Math.abs(Math.sin(runPhase)) * 0.13;
          bodyCenter.position.y = THREE.MathUtils.lerp(bodyCenter.position.y, 1.05 + bob + jumpY, dt * 14);

          leftLeg.rotation.x = Math.sin(runPhase) * 0.85;
          rightLeg.rotation.x = -Math.sin(runPhase) * 0.85;
          leftArm.rotation.x = -Math.sin(runPhase) * 0.75;
          rightArm.rotation.x = Math.sin(runPhase) * 0.75;
          leftArm.rotation.z = THREE.MathUtils.lerp(leftArm.rotation.z, 0, dt * 8);
          rightArm.rotation.z = THREE.MathUtils.lerp(rightArm.rotation.z, 0, dt * 8);

          // Step dust & soft sound
          var stepSign = Math.sin(runPhase) >= 0 ? 1 : -1;
          if (stepSign !== lastStepSign && isGrounded) {
            lastStepSign = stepSign;
            spawnDust(stepSign * 0.2, 0.06, -0.25, 2, 0.25);
          }

        } else if (motionMode === 'sit') {
          rollAngle = THREE.MathUtils.lerp(rollAngle, 0, dt * 8);
          bodyCenter.rotation.x = THREE.MathUtils.lerp(bodyCenter.rotation.x, -0.05, dt * 8);
          var sitBob = Math.sin(elapsed * 2.4) * 0.015;
          bodyCenter.position.y = THREE.MathUtils.lerp(bodyCenter.position.y, 0.68 + sitBob + jumpY, dt * 8);

          leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, -1.32, dt * 8);
          rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, -1.32, dt * 8);
          leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, -0.35 + Math.sin(elapsed * 2) * 0.05, dt * 8);
          rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, -0.35 - Math.sin(elapsed * 2) * 0.05, dt * 8);

        } else if (motionMode === 'roll') {
          rollAngle += dt * 7.8;
          bodyCenter.rotation.x = rollAngle;
          var rollBounce = Math.abs(Math.sin(rollAngle * 2)) * 0.06;
          bodyCenter.position.y = THREE.MathUtils.lerp(bodyCenter.position.y, 0.66 + rollBounce + jumpY, dt * 12);

          // Tuck limbs slightly while rolling
          leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, -0.9, dt * 10);
          rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, -0.9, dt * 10);
          leftArm.rotation.z = THREE.MathUtils.lerp(leftArm.rotation.z, 0.5, dt * 10);
          rightArm.rotation.z = THREE.MathUtils.lerp(rightArm.rotation.z, -0.5, dt * 10);

          if (Math.random() < 0.32 && isGrounded) {
            spawnDust(0, 0.06, -0.35, 1, 0.35);
          }
        }

        // Jelly squash & stretch damped spring
        var springK = 145;
        var damping = 9.5;
        var accelY = -springK * (jellyScaleY - 1.0) - damping * jellyVelY;
        jellyVelY += accelY * dt;
        jellyScaleY += jellyVelY * dt;
        jellyScaleY = THREE.MathUtils.clamp(jellyScaleY, 0.68, 1.38);
        var invXZ = 1.0 / Math.sqrt(jellyScaleY);
        physicsGroup.scale.set(invXZ, jellyScaleY, invXZ);

        // Tilt springs
        tiltVelX += (-120 * tiltX - 9 * tiltVelX) * dt;
        tiltX += tiltVelX * dt;
        tiltVelZ += (-120 * tiltZ - 9 * tiltVelZ) * dt;
        tiltZ += tiltVelZ * dt;
        physicsGroup.rotation.x = tiltX;
        physicsGroup.rotation.z = tiltZ;

        // Breeze gust decay & subtle character glance toward tapped ground
        if (windBoost > 0) windBoost = Math.max(0, windBoost - dt * 1.4);
        if (lookTimer > 0) {
          lookTimer -= dt;
          characterRoot.rotation.y = THREE.MathUtils.lerp(characterRoot.rotation.y, lookTargetX, dt * 8);
        } else {
          characterRoot.rotation.y = THREE.MathUtils.lerp(characterRoot.rotation.y, 0, dt * 5);
        }

        // Pebble / rock bounce physics
        for (var pbIdx = 0; pbIdx < trackPebbles.length; pbIdx++) {
          var pebObj = trackPebbles[pbIdx];
          if (pebObj.userData.vy !== 0 || pebObj.position.y > pebObj.userData.baseY) {
            pebObj.userData.vy -= 14 * dt;
            pebObj.position.y += pebObj.userData.vy * dt;
            pebObj.rotation.x += pebObj.userData.rotVel * dt;
            if (pebObj.position.y <= pebObj.userData.baseY) {
              pebObj.position.y = pebObj.userData.baseY;
              pebObj.userData.vy = 0;
              pebObj.userData.rotVel = 0;
            }
          }
        }

        // Interactive environment object spring sway & bounce
        for (var ei = 0; ei < interactiveEnvObjects.length; ei++) {
          var eObj = interactiveEnvObjects[ei];
          var ud = eObj.userData;
          if (!ud) continue;
          if (ud.interactType === 'palm' || ud.interactType === 'shrub' || ud.interactType === 'stone' || ud.interactType === 'boat' || ud.interactType === 'clocktower' || ud.interactType === 'cat' || ud.interactType === 'duck' || ud.interactType === 'ibex') {
            var acc = -75 * ud.swayAngle - 6.5 * ud.swayVel;
            ud.swayVel += acc * dt;
            ud.swayAngle += ud.swayVel * dt;
            eObj.rotation.z = ud.swayAngle * 0.08;
          } else if (ud.interactType === 'pebble' && (ud.vy !== 0 || eObj.position.y > ud.baseY)) {
            ud.vy -= 13 * dt;
            eObj.position.y += ud.vy * dt;
            eObj.rotation.y += ud.rotVel * dt;
            if (eObj.position.y <= ud.baseY) {
              eObj.position.y = ud.baseY;
              ud.vy = 0;
              ud.rotVel = 0;
            }
          }
        }

        // Water ripples update
        for (var ri = ripples.length - 1; ri >= 0; ri--) {
          var rp = ripples[ri];
          rp.life -= dt;
          if (rp.life <= 0) {
            scene.remove(rp.mesh);
            ripples.splice(ri, 1);
          } else {
            var prog = 1 - rp.life / rp.maxLife;
            rp.mesh.scale.setScalar(1 + prog * 4.5);
            rp.mesh.material.opacity = (1 - prog) * 0.85;
          }
        }

        // Headband tails flutter
        var wind = (motionMode === 'sit' ? 1.5 : 8.5) + windBoost * 5.0;
        tail1.rotation.y = Math.PI * 0.78 + Math.sin(elapsed * wind) * 0.18;
        tail2.rotation.y = Math.PI * 0.86 + Math.cos(elapsed * wind * 1.15) * 0.22;

        // Blinking & expressive eyebrows
        blinkTimer += dt;
        var isBlinking = (blinkTimer % 3.6) > 3.45;
        var lidRot = isBlinking ? 0.05 : -Math.PI * 0.55;
        leftEye.eyelid.rotation.x = THREE.MathUtils.lerp(leftEye.eyelid.rotation.x, lidRot, dt * 24);
        rightEye.eyelid.rotation.x = THREE.MathUtils.lerp(rightEye.eyelid.rotation.x, lidRot, dt * 24);

        if (surpriseTimer > 0) {
          surpriseTimer -= dt;
          leftBrow.position.y = THREE.MathUtils.lerp(leftBrow.position.y, 0.30, dt * 18);
          rightBrow.position.y = THREE.MathUtils.lerp(rightBrow.position.y, 0.30, dt * 18);
        } else {
          leftBrow.position.y = THREE.MathUtils.lerp(leftBrow.position.y, 0.255, dt * 10);
          rightBrow.position.y = THREE.MathUtils.lerp(rightBrow.position.y, 0.255, dt * 10);
        }

        // Update particles
        for (var k = particles.length - 1; k >= 0; k--) {
          var p = particles[k];
          p.life -= dt;
          if (p.life <= 0) {
            scene.remove(p.mesh);
            particles.splice(k, 1);
          } else {
            p.mesh.position.x += p.vx * dt;
            p.mesh.position.y += p.vy * dt;
            p.mesh.position.z += p.vz * dt;
            p.vy -= 1.8 * dt;
            p.mesh.material.opacity = (p.life / p.maxLife) * 0.72;
            p.mesh.scale.multiplyScalar(1 + dt * 0.9);
          }
        }

        controls.update();
        renderer.render(scene, camera);
      }

      window.addEventListener('resize', function () {
        renderer.setSize(window.innerWidth, window.innerHeight);
        applyResponsiveCamera(false);
      });

      animate();
    })();
  </script>
</body>
</html>
