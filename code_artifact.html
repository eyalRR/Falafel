<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>פלאפלוצ׳יק וחומוסון: המסע להצלת הפיתה הגדולה</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #87ceeb;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Icon-only floating HUD */
    .hud-top {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 20;
      gap: 8px;
    }

    .hud-bottom {
      position: fixed;
      bottom: calc(max(16px, env(safe-area-inset-bottom)) + 10px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }

    .pill-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      background: rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.18);
      pointer-events: auto;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.55);
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
      padding: 0;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.85);
      transform: translateY(-1px);
    }

    .icon-btn:active {
      transform: scale(0.9);
    }

    .icon-btn.active {
      background: #0038b8;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(0, 56, 184, 0.4);
    }

    .icon-btn.env-active {
      background: #d97706;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(217, 119, 6, 0.4);
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
      stroke-width: 2.1;
      pointer-events: none;
    }

    .location-toast {
      direction: rtl;
      position: fixed;
      top: calc(max(12px, env(safe-area-inset-top)) + 64px);
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 25;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.22);
    }

    .story-pill {
      direction: rtl;
      position: fixed;
      top: calc(max(12px, env(safe-area-inset-top)) + 58px);
      left: 50%;
      transform: translateX(-50%);
      max-width: min(92vw, 390px);
      padding: 7px 14px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.56);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #f8fafc;
      font-size: 12.5px;
      line-height: 1.3;
      text-align: center;
      pointer-events: auto;
      z-index: 19;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.2);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .story-dots {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .story-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.3);
      transition: background-color 0.25s ease, transform 0.25s ease;
    }

    .story-dot.done {
      background: #fbbf24;
    }

    .story-dot.current {
      background: #38bdf8;
      transform: scale(1.25);
    }

    .star-counter {
      font-size: 12px;
      font-weight: 700;
      color: #fde047;
      background: rgba(250, 204, 21, 0.16);
      border: 1px solid rgba(250, 204, 21, 0.35);
      border-radius: 999px;
      padding: 2px 8px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .story-text {
      flex: 1;
      font-weight: 500;
    }

    .story-replay-btn {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
    }

    .story-replay-btn.visible {
      display: flex;
    }

    .story-replay-btn svg {
      width: 15px;
      height: 15px;
    }

    .location-toast {
      direction: rtl;
      top: calc(max(12px, env(safe-area-inset-top)) + 106px) !important;
    }

    .transition-curtain {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(30, 27, 75, 0.45) 0%, rgba(2, 6, 23, 0.96) 75%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.15s ease-in-out;
      z-index: 30;
    }

    .transition-curtain.active {
      opacity: 1;
      pointer-events: auto;
    }

    .story-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.62);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease;
    }

    .story-modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .story-card {
      direction: rtl;
      width: 100%;
      max-width: 360px;
      background: linear-gradient(160deg, rgba(15, 23, 42, 0.94), rgba(30, 27, 75, 0.92));
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 24px;
      padding: 22px 20px 18px;
      color: #f1f5f9;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      text-align: center;
    }

    .story-card-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fbbf24;
      margin-bottom: 6px;
    }

    .story-card-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .story-card-body {
      font-size: 13.5px;
      line-height: 1.5;
      color: #cbd5e1;
      margin-bottom: 16px;
    }

    .story-card-btn {
      width: 52px;
      height: 52px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
      transition: transform 0.16s ease;
    }

    .story-card-btn:active {
      transform: scale(0.92);
    }

    .story-card-btn svg {
      width: 24px;
      height: 24px;
    }

    .location-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 420px) {
      .pill-bar {
        gap: 4px;
        padding: 5px;
      }
      .icon-btn {
        width: 40px;
        height: 40px;
      }
      .icon-btn svg {
        width: 20px;
        height: 20px;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="location-toast" class="location-toast" aria-live="polite"></div>
  <div id="transition-curtain" class="transition-curtain"></div>
  <div id="story-modal-backdrop" class="story-modal-backdrop">
    <div class="story-card">
      <div class="story-card-badge" id="story-card-badge"></div>
      <div class="story-card-title" id="story-card-title"></div>
      <div class="story-card-body" id="story-card-body"></div>
      <button class="story-card-btn" id="btn-story-go" aria-label="Continue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="6 4 20 12 6 20 6 4"/>
        </svg>
      </button>
    </div>
  </div>
  <div id="story-pill" class="story-pill" aria-live="polite">
    <div class="story-dots" id="story-dots">
      <span class="story-dot current"></span>
      <span class="story-dot"></span>
      <span class="story-dot"></span>
      <span class="story-dot"></span>
    </div>
    <div class="star-counter" id="star-counter">★ 0/3</div>
    <div class="story-text" id="story-text"></div>
    <button class="story-replay-btn" id="btn-story-replay" aria-label="Replay Rescue Story" title="Replay">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
    </button>
  </div>

  <!-- Top Bar: Israeli Locations (left) + Sound & Camera Reset (right) -->
  <div class="hud-top">
    <div class="pill-bar" role="group" aria-label="Locations">
      <!-- 1. Jerusalem / Western Wall (Kotel) -->
      <button class="icon-btn env-active" id="btn-env-kotel" data-env="kotel" aria-label="Western Wall Jerusalem" title="Western Wall, Jerusalem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="1.5"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
          <line x1="3" y1="15" x2="21" y2="15"/>
          <line x1="9" y1="5" x2="9" y2="10"/>
          <line x1="15" y1="10" x2="15" y2="15"/>
          <line x1="10" y1="15" x2="10" y2="19"/>
        </svg>
      </button>

      <!-- 2. Masada (Desert Fortress Mesa) -->
      <button class="icon-btn" id="btn-env-masada" data-env="masada" aria-label="Masada" title="Masada, Judean Desert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 19l5-10h10l5 10H2z"/>
          <path d="M7 9l2 3h6l2-3"/>
          <circle cx="18" cy="5" r="2"/>
        </svg>
      </button>

      <!-- 3. Sea of Galilee (Kinneret) -->
      <button class="icon-btn" id="btn-env-kinneret" data-env="kinneret" aria-label="Sea of Galilee" title="Sea of Galilee (Kinneret)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 15c2-1.5 4-1.5 6 0s4 1.5 6 0 4-1.5 6 0"/>
          <path d="M3 19c2-1.5 4-1.5 6 0s4 1.5 6 0 4-1.5 6 0"/>
          <path d="M12 4v3"/>
          <path d="M6.5 6.5l2 2"/>
          <path d="M17.5 6.5l-2 2"/>
          <path d="M7 12a5 5 0 0 1 10 0"/>
        </svg>
      </button>

      <!-- 4. Old Jaffa / Tel Aviv Coast -->
      <button class="icon-btn" id="btn-env-jaffa" data-env="jaffa" aria-label="Old Jaffa Coast" title="Old Jaffa &amp; Coast">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20V9"/>
          <path d="M12 9c-3-3-7-2-8 1 2.5-.5 5 .5 8-1z"/>
          <path d="M12 9c3-3 7-2 8 1-2.5-.5-5 .5-8-1z"/>
          <path d="M12 9c-2-4-5-5-6-5 2 1 4 2.5 6 5z"/>
          <path d="M12 9c2-4 5-5 6-5-2 1-4 2.5-6 5z"/>
          <path d="M5 20h14"/>
        </svg>
      </button>
    </div>

    <div class="pill-bar" role="group" aria-label="Utilities">
      <!-- Sound Toggle -->
      <button class="icon-btn" id="btn-sound" aria-label="Toggle Sound" title="Sound">
        <svg id="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
        <svg id="icon-sound-off" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <line x1="23" y1="9" x2="17" y2="15"/>
          <line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
      </button>

      <!-- Story / Lore -->
      <button class="icon-btn" id="btn-story-info" aria-label="Story" title="Story">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </button>

      <!-- Reset Camera -->
      <button class="icon-btn" id="btn-reset-cam" aria-label="Reset Camera" title="Reset Camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Bottom Bar: Motion Modes (Run, Sit, Roll, Jump) -->
  <div class="hud-bottom">
    <div class="pill-bar" role="group" aria-label="Motion Modes">
      <!-- Run -->
      <button class="icon-btn active" id="btn-mode-run" data-mode="run" aria-label="Run on Track" title="Run">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="13" cy="4.5" r="2"/>
          <path d="M10 9.5l3-1.5 3.5 3 2.5-.5"/>
          <path d="M13 8l-2 5.5-4.5 2"/>
          <path d="M11 13.5l3.5 2.5-1 5"/>
          <path d="M7 9.5l3 0"/>
        </svg>
      </button>

      <!-- Sit -->
      <button class="icon-btn" id="btn-mode-sit" data-mode="sit" aria-label="Sit on Ground" title="Sit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="5" r="2"/>
          <path d="M9 8v6h6l2 5"/>
          <path d="M9 11l4 1"/>
          <line x1="4" y1="19" x2="20" y2="19"/>
        </svg>
      </button>

      <!-- Roll -->
      <button class="icon-btn" id="btn-mode-roll" data-mode="roll" aria-label="Roll" title="Roll">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="7"/>
          <path d="M12 5a7 7 0 0 1 6.5 4.5"/>
          <polyline points="19 6 19 10 15 10"/>
          <circle cx="10.5" cy="11" r="0.8" fill="currentColor"/>
          <circle cx="14" cy="11" r="0.8" fill="currentColor"/>
        </svg>
      </button>

      <!-- Jump / Bounce -->
      <button class="icon-btn" id="btn-jump" aria-label="Jump" title="Jump">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 17V5"/>
          <polyline points="7 10 12 5 17 10"/>
          <path d="M6 20h12"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // =========================================================
      // 1. AUDIO SYNTHESIS (Web Audio API, starts on first touch)
      // =========================================================
      var audioCtx = null;
      var soundEnabled = true;

      var audioBus = {
        master: null,
        stageGain: null,
        echoIn: null,
        padOscs: [],
        noiseNode: null,
        lfoNode: null,
        phraseTimer: null,
        foleyTimer: null,
        drumTimer: null,
        currentStage: 'jaffa',
        phraseStep: 0,
        drumStep: 0
      };

      var STAGE_SCORES = {
        jaffa: {
          padFreqs: [82.41, 123.47], // E2 + B2 warm coastal drone
          phrase: [
            { f: 329.63, d: 0.55 }, { f: 349.23, d: 0.35 }, { f: 415.30, d: 0.75 }, { f: 0, d: 0.4 },
            { f: 440.00, d: 0.45 }, { f: 415.30, d: 0.40 }, { f: 349.23, d: 0.50 }, { f: 329.63, d: 0.95 }
          ],
          voice: 'oud',
          drumPattern: [1, 0, 2, 0, 1, 2, 0, 0], // 1=dum, 2=tek
          drumMs: 360,
          noiseFreq: 310, noiseQ: 0.8, noiseVol: 0.055, lfoHz: 0.16
        },
        kinneret: {
          padFreqs: [110.0, 164.81], // A2 + E3 serene lake pad
          phrase: [
            { f: 440.0, d: 0.45 }, { f: 523.25, d: 0.45 }, { f: 659.25, d: 0.80 }, { f: 587.33, d: 0.50 },
            { f: 523.25, d: 0.45 }, { f: 0, d: 0.35 }, { f: 493.88, d: 0.55 }, { f: 440.0, d: 1.0 }
          ],
          voice: 'harp',
          drumPattern: null,
          noiseFreq: 480, noiseQ: 1.3, noiseVol: 0.032, lfoHz: 0.24
        },
        masada: {
          padFreqs: [73.42, 110.0], // D2 + A2 deep desert canyon drone
          phrase: [
            { f: 293.66, d: 0.85 }, { f: 311.13, d: 0.50 }, { f: 369.99, d: 0.95 }, { f: 0, d: 0.55 },
            { f: 440.00, d: 0.65 }, { f: 392.00, d: 0.45 }, { f: 311.13, d: 0.60 }, { f: 293.66, d: 1.1 }
          ],
          voice: 'flute',
          drumPattern: [1, 0, 0, 2, 1, 0, 2, 0],
          drumMs: 420,
          noiseFreq: 640, noiseQ: 3.0, noiseVol: 0.052, lfoHz: 0.13
        },
        kotel: {
          padFreqs: [73.42, 146.83, 220.0], // D2 + D3 + A3 reverent stone chord
          phrase: [
            { f: 293.66, d: 0.70 }, { f: 349.23, d: 0.60 }, { f: 440.00, d: 0.90 }, { f: 0, d: 0.45 },
            { f: 392.00, d: 0.55 }, { f: 349.23, d: 0.55 }, { f: 329.63, d: 0.55 }, { f: 293.66, d: 1.15 }
          ],
          voice: 'cello',
          drumPattern: null,
          noiseFreq: 250, noiseQ: 1.0, noiseVol: 0.022, lfoHz: 0.09
        },
        dawn: {
          padFreqs: [130.81, 196.0, 246.94], // Cmaj7 warm sunrise strings
          phrase: [
            { f: 523.25, d: 0.35 }, { f: 659.25, d: 0.35 }, { f: 783.99, d: 0.45 }, { f: 987.77, d: 0.70 },
            { f: 1046.5, d: 0.85 }, { f: 783.99, d: 0.40 }, { f: 659.25, d: 0.50 }, { f: 523.25, d: 0.90 }
          ],
          voice: 'harp',
          drumPattern: null,
          noiseFreq: 420, noiseQ: 0.7, noiseVol: 0.014, lfoHz: 0.12
        }
      };

      function initAudioBus() {
        if (!audioCtx || audioBus.master) return;
        audioBus.master = audioCtx.createGain();
        audioBus.master.gain.value = 1.0;
        audioBus.master.connect(audioCtx.destination);

        audioBus.stageGain = audioCtx.createGain();
        audioBus.stageGain.gain.value = 1.0;
        audioBus.stageGain.connect(audioBus.master);

        // Warm canyon/courtyard stereo-like echo bus
        var delay = audioCtx.createDelay(1.0);
        delay.delayTime.value = 0.34;
        var fb = audioCtx.createGain();
        fb.gain.value = 0.36;
        var echoFilter = audioCtx.createBiquadFilter();
        echoFilter.type = 'lowpass';
        echoFilter.frequency.value = 1150;
        var echoWet = audioCtx.createGain();
        echoWet.gain.value = 0.38;

        audioBus.echoIn = audioCtx.createGain();
        audioBus.echoIn.gain.value = 1.0;
        audioBus.echoIn.connect(audioBus.stageGain);
        audioBus.echoIn.connect(delay);
        delay.connect(echoFilter);
        echoFilter.connect(fb);
        fb.connect(delay);
        echoFilter.connect(echoWet);
        echoWet.connect(audioBus.stageGain);
      }

      function playDrumHit(type) {
        if (!soundEnabled || !audioCtx || !audioBus.stageGain) return;
        try {
          var now = audioCtx.currentTime;
          if (type === 1) {
            // Darbuka Dum
            var osc = audioCtx.createOscillator();
            var g = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(108, now);
            osc.frequency.exponentialRampToValueAtTime(48, now + 0.16);
            g.gain.setValueAtTime(0.09, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
            osc.connect(g);
            g.connect(audioBus.stageGain);
            osc.start(now);

          } else if (type === 2) {

            var bufLen = Math.floor(audioCtx.sampleRate * 0.05);
            var buf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
            var d = buf.getChannelData(0);
            for (var i = 0; i < bufLen; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / bufLen);
            var src = audioCtx.createBufferSource();
            src.buffer = buf;
            var bp = audioCtx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.frequency.value = 1850;
            bp.Q.value = 2.0;
            var g2 = audioCtx.createGain();
            g2.gain.setValueAtTime(0.06, now);
            g2.gain.exponentialRampToValueAtTime(0.001, now + 0.055);

            bp.connect(g2);

      function playInstrumentNote(freq, durSec, voice) {
        if (!soundEnabled || !audioCtx || !audioBus.echoIn || freq <= 0) return;
        try {
          var now = audioCtx.currentTime;
          var osc1 = audioCtx.createOscillator();
          var osc2 = audioCtx.createOscillator();
          var filter = audioCtx.createBiquadFilter();
          var gain = audioCtx.createGain();

          if (voice === 'oud') {
            osc1.type = 'triangle';
            osc2.type = 'sawtooth';
            osc1.frequency.setValueAtTime(freq, now);
            osc2.frequency.setValueAtTime(freq * 1.003, now);
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1600, now);
            filter.frequency.exponentialRampToValueAtTime(380, now + durSec);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.052, now + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.001, now + durSec);
          } else if (voice === 'harp') {
            osc1.type = 'sine';
            osc2.type = 'triangle';
            osc1.frequency.setValueAtTime(freq, now);
            osc2.frequency.setValueAtTime(freq * 2, now);
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(2200, now);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.048, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + durSec * 1.15);
          } else if (voice === 'flute') {
            osc1.type = 'sine';
            osc2.type = 'sine';
            osc1.frequency.setValueAtTime(freq * 0.985, now);
            osc1.frequency.linearRampToValueAtTime(freq, now + 0.09);
            osc2.frequency.setValueAtTime(freq * 1.004, now);
            filter.type = 'lowpass';
            filter.frequency.value = 1300;
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.045, now + 0.12);
            gain.gain.exponentialRampToValueAtTime(0.001, now + durSec);
          } else {
            // Warm cello/pad voice
            osc1.type = 'sawtooth';
            osc2.type = 'triangle';
            osc1.frequency.setValueAtTime(freq, now);
            osc2.frequency.setValueAtTime(freq * 0.996, now);
            filter.type = 'lowpass';
            filter.frequency.value = 620;
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.04, now + 0.18);
            gain.gain.exponentialRampToValueAtTime(0.001, now + durSec);
          }

          osc1.connect(filter);
          osc2.connect(filter);
          filter.connect(gain);
          gain.connect(audioBus.echoIn);
          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + durSec + 0.18);
          osc2.stop(now + durSec + 0.18);
        } catch (e) {}
      }

      function stopStageSoundscape() {
        if (audioBus.phraseTimer) { clearTimeout(audioBus.phraseTimer); audioBus.phraseTimer = null; }
        if (audioBus.foleyTimer) { clearInterval(audioBus.foleyTimer); audioBus.foleyTimer = null; }
        if (audioBus.drumTimer) { clearInterval(audioBus.drumTimer); audioBus.drumTimer = null; }
        audioBus.padOscs.forEach(function (o) { try { o.stop(); } catch (e) {} });
        audioBus.padOscs = [];
        try { if (audioBus.noiseNode) audioBus.noiseNode.stop(); } catch (e) {}
        try { if (audioBus.lfoNode) audioBus.lfoNode.stop(); } catch (e) {}
        audioBus.noiseNode = null;
        audioBus.lfoNode = null;
      }

      function startStageSoundscape(stageKey) {
        audioBus.currentStage = stageKey || audioBus.currentStage;
        if (!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
        initAudioBus();

        // Smooth crossfade out/in
        var now = audioCtx.currentTime;
        audioBus.stageGain.gain.cancelScheduledValues(now);
        audioBus.stageGain.gain.setValueAtTime(audioBus.stageGain.gain.value, now);
        audioBus.stageGain.gain.linearRampToValueAtTime(0.02, now + 0.28);
        audioBus.stageGain.gain.linearRampToValueAtTime(1.0, now + 1.05);

        stopStageSoundscape();

        var cfg = STAGE_SCORES[audioBus.currentStage] || STAGE_SCORES.jaffa;
        try {
          // Layer A: Warm detuned harmonic pad
          var padFilter = audioCtx.createBiquadFilter();
          padFilter.type = 'lowpass';
          padFilter.frequency.value = 380;
          var padGain = audioCtx.createGain();
          padGain.gain.value = 0.026;
          padFilter.connect(padGain);
          padGain.connect(audioBus.stageGain);

          cfg.padFreqs.forEach(function (pf) {
            [-0.003, 0.003].forEach(function (det) {
              var po = audioCtx.createOscillator();
              po.type = 'triangle';
              po.frequency.value = pf * (1 + det);
              po.connect(padFilter);
              po.start();
              audioBus.padOscs.push(po);
            });
          });

          // Layer C1: Filtered ocean surf / canyon wind noise
          var bufLen = audioCtx.sampleRate * 2;
          var buf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
          var data = buf.getChannelData(0);
          var lastOut = 0;
          for (var i = 0; i < bufLen; i++) {
            var white = Math.random() * 2 - 1;
            data[i] = (lastOut + 0.035 * white) / 1.035;
            lastOut = data[i];
          }
          var src = audioCtx.createBufferSource();
          src.buffer = buf;
          src.loop = true;

          var nFilter = audioCtx.createBiquadFilter();
          nFilter.type = 'bandpass';
          nFilter.frequency.value = cfg.noiseFreq;
          nFilter.Q.value = cfg.noiseQ;

          var nGain = audioCtx.createGain();
          nGain.gain.value = cfg.noiseVol;

          var lfo = audioCtx.createOscillator();
          lfo.frequency.value = cfg.lfoHz;
          var lfoGain = audioCtx.createGain();
          lfoGain.gain.value = cfg.noiseFreq * 0.35;
          lfo.connect(lfoGain);
          lfoGain.connect(nFilter.frequency);

          src.connect(nFilter);
          nFilter.connect(nGain);
          nGain.connect(audioBus.stageGain);
          src.start();
          lfo.start();
          audioBus.noiseNode = src;
          audioBus.lfoNode = lfo;

          // Layer B: Expressive phrased melody scheduler
          audioBus.phraseStep = 0;
          function scheduleNextNote() {
            if (!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
            var item = cfg.phrase[audioBus.phraseStep % cfg.phrase.length];
            audioBus.phraseStep++;
            if (item.f > 0) playInstrumentNote(item.f, item.d * 0.95, cfg.voice);
            audioBus.phraseTimer = setTimeout(scheduleNextNote, item.d * 1000);
          }
          audioBus.phraseTimer = setTimeout(scheduleNextNote, 320);

          // Layer C2: Darbuka / Frame-Drum pulse (if stage has rhythm)
          if (cfg.drumPattern) {
            audioBus.drumStep = 0;
            audioBus.drumTimer = setInterval(function () {
              if (!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
              var hit = cfg.drumPattern[audioBus.drumStep % cfg.drumPattern.length];
              audioBus.drumStep++;
              if (hit > 0) playDrumHit(hit);
            }, cfg.drumMs);
          }

          // Layer C3: Organic environmental foley (bells, crickets, desert birds, happy chirps)
          audioBus.foleyTimer = setInterval(function () {
            if (Math.random() < 0.72) triggerStageFoley(audioBus.currentStage);
          }, 4200);
        } catch (e) {}
      }

      function ensureAudio() {
        if (!soundEnabled) return null;
        if (!audioCtx) {
          var Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().then(function () {
            if (!audioBus.noiseNode && soundEnabled) startStageSoundscape(audioBus.currentStage);
          }).catch(function () {});
        } else if (audioCtx && audioCtx.state === 'running' && !audioBus.noiseNode && soundEnabled) {
          startStageSoundscape(audioBus.currentStage);
        }
        return audioCtx;
      }

      // 2. PROCEDURAL CANVAS TEXTURES

      function makeFalafelTextures() {
        var size = 512;
        var colorCanvas = document.createElement('canvas');
        colorCanvas.width = size;
        colorCanvas.height = size;
        var ctx = colorCanvas.getContext('2d');

        var bumpCanvas = document.createElement('canvas');
        bumpCanvas.width = size;
        bumpCanvas.height = size;
        var bctx = bumpCanvas.getContext('2d');

        // Base golden-brown fried chickpea crust
        ctx.fillStyle = '#9c4e18';
        ctx.fillRect(0, 0, size, size);
        bctx.fillStyle = '#808080';
        bctx.fillRect(0, 0, size, size);

        var tones = ['#7a380d', '#b8621e', '#c97528', '#5e2908', '#d48735'];
        for (var i = 0; i < 4200; i++) {
          var x = Math.random() * size;
          var y = Math.random() * size;
          var r = 1.2 + Math.random() * 4.5;
          ctx.fillStyle = tones[Math.floor(Math.random() * tones.length)];
          ctx.globalAlpha = 0.45 + Math.random() * 0.45;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();

          var v = Math.floor(85 + Math.random() * 170);
          bctx.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')';
          bctx.globalAlpha = 0.6;
          bctx.beginPath();
          bctx.arc(x, y, r * 0.9, 0, Math.PI * 2);
          bctx.fill();
        }

        // Parsley flecks
        ctx.globalAlpha = 0.88;
        for (var p = 0; p < 220; p++) {
          ctx.fillStyle = Math.random() > 0.4 ? '#2d6a1e' : '#4a8f29';
          ctx.save();
          ctx.translate(Math.random() * size, Math.random() * size);
          ctx.rotate(Math.random() * Math.PI);
          ctx.fillRect(-3, -1.5, 6, 3);
          ctx.restore();
        }

        // Tiny sesame seeds baked into surface
        ctx.fillStyle = '#f5e6c4';
        for (var s = 0; s < 140; s++) {
          ctx.save();
          ctx.translate(Math.random() * size, Math.random() * size);
          ctx.rotate(Math.random() * Math.PI);
          ctx.beginPath();
          ctx.ellipse(0, 0, 3.2, 1.6, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.globalAlpha = 1;

        var map = new THREE.CanvasTexture(colorCanvas);
        map.wrapS = map.wrapT = THREE.RepeatWrapping;
        map.encoding = THREE.sRGBEncoding;

        var bumpMap = new THREE.CanvasTexture(bumpCanvas);
        bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;

        return { map: map, bumpMap: bumpMap };
      }

      function makeFlagHeadbandTexture() {
        var w = 512, h = 128;
        var c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        var ctx = c.getContext('2d');

        // Crisp woven white fabric
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, 0, w, h);

        // Subtle fabric weave
        ctx.fillStyle = 'rgba(148, 163, 184, 0.14)';
        for (var x = 0; x < w; x += 4) {
          ctx.fillRect(x, 0, 1, h);
        }
        for (var y = 0; y < h; y += 4) {
          ctx.fillRect(0, y, w, 1);
        }

        // Top and bottom Israeli blue stripes
        ctx.fillStyle = '#0038b8';
        ctx.fillRect(0, 14, w, 16);
        ctx.fillRect(0, h - 30, w, 16);

        // Star of David (Magen David) centered at front
        function drawStar(cx, cy, r) {
          ctx.strokeStyle = '#0038b8';
          ctx.lineWidth = 4.2;
          ctx.lineJoin = 'miter';
          for (var t = 0; t < 2; t++) {
            ctx.beginPath();
            var offset = t === 0 ? -Math.PI / 2 : Math.PI / 2;
            for (var k = 0; k < 3; k++) {
              var ang = offset + (k * Math.PI * 2) / 3;
              var px = cx + Math.cos(ang) * r;
              var py = cy + Math.sin(ang) * r;
              if (k === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.stroke();
          }
        }
        drawStar(w * 0.5, h * 0.5, 22);

        var tex = new THREE.CanvasTexture(c);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      function makeSandTrackTexture() {
        var size = 512;
        var c = document.createElement('canvas');
        c.width = size;
        c.height = size;
        var ctx = c.getContext('2d');

        ctx.fillStyle = '#d9b382';
        ctx.fillRect(0, 0, size, size);

        // Trail ruts along Z (vertical in UV)
        var grad = ctx.createLinearGradient(0, 0, size, 0);
        grad.addColorStop(0, '#c69b66');
        grad.addColorStop(0.22, '#e3c396');
        grad.addColorStop(0.5, '#d5ab77');
        grad.addColorStop(0.78, '#e3c396');
        grad.addColorStop(1, '#c69b66');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, size, size);

        for (var i = 0; i < 6500; i++) {
          var x = Math.random() * size;
          var y = Math.random() * size;
          var r = 0.7 + Math.random() * 2.2;
          ctx.fillStyle = Math.random() > 0.5 ? 'rgba(130, 88, 42, 0.25)' : 'rgba(255, 244, 218, 0.35)';
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }

        var bc = document.createElement('canvas');
        bc.width = size; bc.height = size;
        var bctx = bc.getContext('2d');
        bctx.fillStyle = '#808080';
        bctx.fillRect(0, 0, size, size);
        // Wind ripples & track ruts in bump map
        for (var ry = 0; ry < size; ry += 12) {
          bctx.fillStyle = 'rgba(210,210,210,0.22)';
          bctx.fillRect(0, ry, size, 4);
        }
        bctx.fillStyle = 'rgba(50,50,50,0.35)';
        bctx.fillRect(size * 0.2, 0, size * 0.12, size);
        bctx.fillRect(size * 0.68, 0, size * 0.12, size);

        var tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(1, 6);
        tex.encoding = THREE.sRGBEncoding;

        var bump = new THREE.CanvasTexture(bc);
        bump.wrapS = bump.wrapT = THREE.RepeatWrapping;
        bump.repeat.set(1, 6);
        return { map: tex, bumpMap: bump };
      }

      function makeStoneTexture(baseHex, lineHex) {
        var size = 512;
        var c = document.createElement('canvas');
        c.width = size;
        c.height = size;
        var ctx = c.getContext('2d');
        ctx.fillStyle = baseHex || '#e7d5b4';
        ctx.fillRect(0, 0, size, size);

        var rows = 6;
        var rowH = size / rows;
        for (var r = 0; r < rows; r++) {
          var y = r * rowH;
          var cols = 3 + (r % 2);
          var colW = size / cols;
          var shift = (r % 2) * (colW * 0.45);
          for (var col = -1; col <= cols; col++) {
            var x = col * colW + shift;
            var shade = (Math.random() - 0.5) * 18;
            ctx.fillStyle = 'rgba(' + (232 + shade) + ',' + (212 + shade) + ',' + (176 + shade) + ', 0.9)';
            ctx.fillRect(x + 2, y + 2, colW - 4, rowH - 4);
            ctx.strokeStyle = lineHex || '#b09872';
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, colW, rowH);
          }
        }
        // Subtle grain
        for (var g = 0; g < 1800; g++) {
          ctx.fillStyle = Math.random() > 0.5 ? 'rgba(110,90,65,0.12)' : 'rgba(255,250,240,0.14)';
          ctx.fillRect(Math.random() * size, Math.random() * size, 3, 3);
        }
        var bc = document.createElement('canvas');
        bc.width = size; bc.height = size;
        var bctx = bc.getContext('2d');
        bctx.fillStyle = '#c8c8c8';
        bctx.fillRect(0, 0, size, size);
        for (var r2 = 0; r2 < rows; r2++) {
          var y2 = r2 * rowH;
          var cols2 = 3 + (r2 % 2);
          var colW2 = size / cols2;
          var shift2 = (r2 % 2) * (colW2 * 0.45);
          bctx.strokeStyle = '#303030';
          bctx.lineWidth = 6;
          for (var col2 = -1; col2 <= cols2; col2++) {
            bctx.strokeRect(col2 * colW2 + shift2, y2, colW2, rowH);
          }
        }
        var tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.encoding = THREE.sRGBEncoding;
        var bump = new THREE.CanvasTexture(bc);
        bump.wrapS = bump.wrapT = THREE.RepeatWrapping;
        return { map: tex, bumpMap: bump };
      }

      function makePitaTexture() {
        var size = 256;
        var c = document.createElement('canvas');
        c.width = size;
        c.height = size;
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#edd29f';
        ctx.fillRect(0, 0, size, size);
        for (var i = 0; i < 650; i++) {
          ctx.fillStyle = Math.random() > 0.7 ? 'rgba(168, 112, 52, 0.25)' : 'rgba(255, 245, 224, 0.35)';
          ctx.beginPath();
          ctx.arc(Math.random() * size, Math.random() * size, 1 + Math.random() * 5, 0, Math.PI * 2);
          ctx.fill();
        }
        var tex = new THREE.CanvasTexture(c);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      // =========================================================
      // 3. SCENE, RENDERER, CAMERA & SKY DOME (NO BLACK BG EVER)
      // =========================================================
      var container = document.getElementById('canvas-container');
      var scene = new THREE.Scene();
      scene.background = new THREE.Color('#6db8f2');
      scene.fog = new THREE.Fog('#d8ecfa', 18, 65);

      var camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 160);
      var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      var controls = THREE.OrbitControls
        ? new THREE.OrbitControls(camera, renderer.domElement)
        : { target: new THREE.Vector3(0, 0.95, 0), update: function () {} };
      if (THREE.OrbitControls) {
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.enablePan = false;
        controls.minDistance = 2.4;
        controls.maxDistance = 8.5;
        controls.minPolarAngle = 0.25;
        controls.maxPolarAngle = Math.PI * 0.48;
        controls.target.set(0, 0.95, 0);
      }

      function applyResponsiveCamera(resetPosition) {
        var aspect = window.innerWidth / window.innerHeight;
        camera.aspect = aspect;
        // Ensure character fills mobile portrait cleanly without clipping or shrinking
        if (aspect < 0.75) {
          camera.fov = 48;
        } else if (aspect < 1.1) {
          camera.fov = 44;
        } else {
          camera.fov = 38;
        }
        camera.updateProjectionMatrix();
        if (resetPosition) {
          var maxDist = controls.maxDistance || 8.5;
          var dir = new THREE.Vector3(0.46, 0.28, 0.84).normalize();
          controls.target.set(0, 0.98, 0);
          camera.position.copy(controls.target).addScaledVector(dir, maxDist);
          controls.update();
        }
      }
      applyResponsiveCamera(true);

      // Procedural Sky Dome Shader (guarantees bright sky, never black)
      var skyUniforms = {
        topColor: { value: new THREE.Color('#2b82d9') },
        bottomColor: { value: new THREE.Color('#f7e2bc') },
        sunColor: { value: new THREE.Color('#fff5d6') },
        sunDir: { value: new THREE.Vector3(0.5, 0.45, -0.7).normalize() }
      };
      var skyMat = new THREE.ShaderMaterial({
        uniforms: skyUniforms,
        side: THREE.BackSide,
        depthWrite: false,
        vertexShader: [
          'varying vec3 vWorldPos;',
          'void main() {',
          '  vec4 wp = modelMatrix * vec4(position, 1.0);',
          '  vWorldPos = wp.xyz;',
          '  gl_Position = projectionMatrix * viewMatrix * wp;',
          '}'
        ].join('\n'),
        fragmentShader: [
          'uniform vec3 topColor;',
          'uniform vec3 bottomColor;',
          'uniform vec3 sunColor;',
          'uniform vec3 sunDir;',
          'varying vec3 vWorldPos;',
          'void main() {',
          '  vec3 dir = normalize(vWorldPos);',
          '  float h = clamp(dir.y * 0.9 + 0.12, 0.0, 1.0);',
          '  vec3 col = mix(bottomColor, topColor, pow(h, 0.65));',
          '  float sunAmt = max(dot(dir, sunDir), 0.0);',
          '  col += sunColor * pow(sunAmt, 24.0) * 0.42;',
          '  col += sunColor * pow(sunAmt, 180.0) * 0.55;',
          '  gl_FragColor = vec4(col, 1.0);',
          '}'
        ].join('\n')
      });
      var skyDome = new THREE.Mesh(new THREE.SphereGeometry(75, 32, 20), skyMat);
      scene.add(skyDome);

      // Lighting
      var hemiLight = new THREE.HemisphereLight('#fff8e8', '#b88a58', 0.95);
      scene.add(hemiLight);

      var sunLight = new THREE.DirectionalLight('#fff3d6', 1.35);

      sunLight.shadow.mapSize.width = 1024;

      sunLight.shadow.camera.far = 26;

      sunLight.shadow.camera.left = -d;
      sunLight.shadow.camera.right = d;

      var rimLight = new THREE.DirectionalLight('#b7dcff', 0.45);

      scene.add(rimLight);

      // =========================================================
      // 4. TRAVEL SANDY TRACK & GROUND
      // =========================================================
      var sandBundle = makeSandTrackTexture();
      var sandTex = sandBundle.map;
      var groundMat = new THREE.MeshStandardMaterial({
        color: '#dfc092',
        bumpMap: sandBundle.bumpMap,
        bumpScale: 0.04,
        roughness: 0.94,
        metalness: 0.0
      });
      var groundGeo = new THREE.PlaneGeometry(140, 140, 64, 64);
      var gPos = groundGeo.attributes.position;
      for (var gi = 0; gi < gPos.count; gi++) {
        var gx = gPos.getX(gi);
        var gy = gPos.getY(gi); // becomes -Z after rotation
        var distFromTrack = Math.max(0, Math.abs(gx) - 2.1);
        var dune = Math.sin(gx * 0.18 + gy * 0.12) * Math.cos(gy * 0.15) * Math.min(distFromTrack * 0.22, 1.35);
        gPos.setZ(gi, dune);
      }
      groundGeo.computeVertexNormals();
      var groundPlane = new THREE.Mesh(groundGeo, groundMat);
      groundPlane.rotation.x = -Math.PI / 2;
      groundPlane.receiveShadow = true;
      scene.add(groundPlane);

      function sculptGround(envName) {
        var gp = groundGeo.attributes.position;
        for (var i = 0; i < gp.count; i++) {
          var gx = gp.getX(i);
          var gy = gp.getY(i); // worldZ = -gy
          var worldZ = -gy;
          var distFromTrack = Math.max(0, Math.abs(gx) - 2.1);
          var h = Math.sin(gx * 0.18 + gy * 0.12) * Math.cos(gy * 0.15) * Math.min(distFromTrack * 0.22, 1.25);

          if (envName === 'jaffa' && gx < -2.1) {
            // Smoothly slope seabed below Mediterranean Sea on the left
            var tJ = Math.min((Math.abs(gx) - 2.1) / 2.2, 1.0);
            h = -0.55 * tJ;
          } else if (envName === 'kinneret' && gx > 2.1) {
            // Smoothly slope seabed below Sea of Galilee on the right
            var tK = Math.min((gx - 2.1) / 2.2, 1.0);
            h = -0.55 * tK;
          } else if (envName === 'masada' && worldZ < -15.5) {
            // Depress distant Dead Sea basin
            h = -0.45;
          }
          gp.setZ(i, h);
        }
        gp.needsUpdate = true;
        groundGeo.computeVertexNormals();
      }

      // Raised sandy travel track strip with bump relief
      var trackMat = new THREE.MeshStandardMaterial({
        map: sandTex,
        bumpMap: sandBundle.bumpMap,
        bumpScale: 0.045,
        roughness: 0.92,
        metalness: 0.0
      });
      var trackMesh = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.04, 60), trackMat);
      trackMesh.position.set(0, 0.01, 0);
      trackMesh.receiveShadow = true;
      scene.add(trackMesh);

      // Track border pebbles (scrolling)
      var trackPebbles = [];
      var pebbleGeo = new THREE.DodecahedronGeometry(0.06, 0);
      var pebbleMat = new THREE.MeshStandardMaterial({ color: '#b59267', roughness: 0.9 });
      for (var pb = 0; pb < 44; pb++) {
        var pm = new THREE.Mesh(pebbleGeo, pebbleMat);
        var side = pb % 2 === 0 ? -1 : 1;
        pm.position.set(side * (1.22 + Math.random() * 0.4), 0.03, (pb / 44) * 36 - 18);
        pm.scale.set(0.7 + Math.random() * 1.1, 0.5 + Math.random() * 0.5, 0.7 + Math.random() * 1.1);
        pm.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
        pm.castShadow = true;
        pm.receiveShadow = true;
        pm.userData = { interactType: 'pebble', baseY: 0.03, vy: 0, rotVel: 0 };
        scene.add(pm);
        trackPebbles.push(pm);
      }

      // =========================================================
      // 5. HIGH-DETAILED MINIATURE 3D FALAFEL CHARACTER
      // =========================================================
      var characterRoot = new THREE.Group();
      scene.add(characterRoot);

      var physicsGroup = new THREE.Group();
      characterRoot.add(physicsGroup);

      // Center of falafel body at y = 1.05
      var bodyCenter = new THREE.Group();
      bodyCenter.position.set(0, 1.05, 0);
      physicsGroup.add(bodyCenter);

      // 5A. Falafel Body (bumpy crispy sphere + 3D crumbs + sesame + parsley)
      var falafelTex = makeFalafelTextures();
      var falafelGeo = new THREE.SphereGeometry(0.62, 40, 32);
      var posAttr = falafelGeo.attributes.position;
      for (var vi = 0; vi < posAttr.count; vi++) {
        var vx = posAttr.getX(vi);
        var vy = posAttr.getY(vi);
        var vz = posAttr.getZ(vi);
        var n = Math.sin(vx * 18) * Math.cos(vy * 18) * Math.sin(vz * 18) * 0.025 +
                Math.sin(vx * 35 + vz * 29) * 0.012;
        var len = Math.sqrt(vx * vx + vy * vy + vz * vz);
        var scale = (len + n) / len;
        posAttr.setXYZ(vi, vx * scale, vy * scale, vz * scale);
      }
      falafelGeo.computeVertexNormals();

      var falafelMat = new THREE.MeshStandardMaterial({
        map: falafelTex.map,
        bumpMap: falafelTex.bumpMap,
        bumpScale: 0.035,
        roughness: 0.85,
        metalness: 0.02
      });
      var falafelMesh = new THREE.Mesh(falafelGeo, falafelMat);
      falafelMesh.castShadow = true;
      falafelMesh.receiveShadow = true;
      bodyCenter.add(falafelMesh);

      // 3D sesame seeds & herbs embedded on the front/sides
      var sesameGeo = new THREE.SphereGeometry(0.024, 8, 6);
      sesameGeo.scale(1.6, 0.75, 0.9);
      var sesameMat = new THREE.MeshStandardMaterial({ color: '#f7ebc8', roughness: 0.55 });
      var herbGeo = new THREE.BoxGeometry(0.035, 0.015, 0.028);
      var herbMat = new THREE.MeshStandardMaterial({ color: '#3b8222', roughness: 0.8 });

      for (var si = 0; si < 48; si++) {
        var phi = Math.acos(2 * Math.random() - 1);
        var theta = Math.random() * Math.PI * 2;
        // Avoid covering eyes/mouth front patch
        var sx = Math.sin(phi) * Math.cos(theta);
        var sy = Math.cos(phi);
        var sz = Math.sin(phi) * Math.sin(theta);
        if (sz > 0.35 && sy > -0.35 && sy < 0.35 && Math.abs(sx) < 0.48) continue;

        var isHerb = si % 3 === 0;
        var speck = new THREE.Mesh(isHerb ? herbGeo : sesameGeo, isHerb ? herbMat : sesameMat);
        speck.position.set(sx * 0.615, sy * 0.615, sz * 0.615);
        speck.lookAt(sx * 2, sy * 2, sz * 2);
        speck.rotateZ(Math.random() * Math.PI);
        bodyCenter.add(speck);
      }

      // 5B. Face: Big Glossy Cartoon Eyes, Eyebrows, Happy Mouth & Tongue
      var faceGroup = new THREE.Group();
      bodyCenter.add(faceGroup);

      function createEye(xPos) {
        var eyeGroup = new THREE.Group();
        eyeGroup.position.set(xPos, 0.08, 0.53);

        var sclera = new THREE.Mesh(
          new THREE.SphereGeometry(0.145, 24, 20),

        iris.scale.set(1, 1.05, 0.65);

      }

      var leftEye = createEye(-0.145);
      var rightEye = createEye(0.145);
      faceGroup.add(leftEye.group, rightEye.group);

      // Expressive Eyebrows
      var browMat = new THREE.MeshStandardMaterial({ color: '#3b1e0a', roughness: 0.75 });
      function createBrow(xPos, tilt) {

        var g = new THREE.Group();

        bar.rotation.z = Math.PI / 2;
        g.add(bar);
        var cap1 = new THREE.Mesh(new THREE.SphereGeometry(0.024, 10, 8), browMat);
        cap1.position.x = -0.08;

        g.add(cap1, cap2);

      }
      var leftBrow = createBrow(-0.15, 0.16);
      var rightBrow = createBrow(0.15, -0.16);
      faceGroup.add(leftBrow, rightBrow);

      // Happy Open Mouth & Tongue
      var mouthGroup = new THREE.Group();
      mouthGroup.position.set(0, -0.18, 0.54);
      var mouthCavity = new THREE.Mesh(
        new THREE.SphereGeometry(0.175, 24, 16, 0, Math.PI * 2, Math.PI * 0.45, Math.PI * 0.55),
        new THREE.MeshStandardMaterial({ color: '#450a0a', roughness: 0.7, side: THREE.DoubleSide })
      );
      mouthCavity.scale.set(1.15, 0.95, 0.55);
      mouthCavity.rotation.x = 0.2;
      mouthGroup.add(mouthCavity);

      var tongue = new THREE.Mesh(
        new THREE.SphereGeometry(0.095, 18, 12),
        new THREE.MeshStandardMaterial({ color: '#ef6a6e', roughness: 0.35 })
      );
      tongue.scale.set(1.05, 0.55, 0.85);
      tongue.position.set(0, -0.08, 0.035);
      mouthGroup.add(tongue);
      faceGroup.add(mouthGroup);

      // 5C. Israeli Flag Headband + Flowing Tails
      var headbandGroup = new THREE.Group();
      headbandGroup.position.set(0, 0.24, 0);
      headbandGroup.rotation.x = -0.18;
      bodyCenter.add(headbandGroup);

      var bandTex = makeFlagHeadbandTexture();
      var bandMat = new THREE.MeshStandardMaterial({
        map: bandTex,
        roughness: 0.65,
        side: THREE.DoubleSide
      });
      var bandGeo = new THREE.CylinderGeometry(0.585, 0.605, 0.15, 42, 1, true);
      // Rotate so center of texture (Star of David) faces +Z
      bandGeo.rotateY(-Math.PI / 2);
      var bandMesh = new THREE.Mesh(bandGeo, bandMat);
      bandMesh.castShadow = true;
      headbandGroup.add(bandMesh);

      // Flowing headband tails in back-left
      var tailGeo = new THREE.PlaneGeometry(0.42, 0.13, 8, 2);
      tailGeo.translate(0.21, 0, 0);
      var tailMat = new THREE.MeshStandardMaterial({
        map: bandTex,

        side: THREE.DoubleSide
      });
      var tail1 = new THREE.Mesh(tailGeo, tailMat);
      tail1.position.set(-0.52, 0.01, -0.25);
      tail1.rotation.y = Math.PI * 0.78;
      var tail2 = new THREE.Mesh(tailGeo, tailMat);
      tail2.position.set(-0.50, -0.04, -0.28);
      tail2.rotation.y = Math.PI * 0.86;
      tail2.rotation.z = -0.22;
      headbandGroup.add(tail1, tail2);

      // 5D. Pita Pocket Rim + Fresh Israeli Salad + Dripping Tahini
      var toppingGroup = new THREE.Group();
      toppingGroup.position.set(0, 0.44, -0.03);
      bodyCenter.add(toppingGroup);

      // Folded Pita bread rim framing the top/back
      var pitaTex = makePitaTexture();
      var pitaMat = new THREE.MeshStandardMaterial({ map: pitaTex, roughness: 0.85, side: THREE.DoubleSide });
      var pitaArc = new THREE.Mesh(
        new THREE.TorusGeometry(0.46, 0.11, 14, 28, Math.PI * 1.15),
        pitaMat
      );
      pitaArc.rotation.x = Math.PI * 0.36;
      pitaArc.rotation.z = -Math.PI * 0.075;
      pitaArc.position.set(0, 0.04, -0.06);
      pitaArc.castShadow = true;

      function createWaterMaterial(deepHex, shallowHex) {
        waterUniforms.uDeepColor.value.set(deepHex);
        waterUniforms.uShallowColor.value.set(shallowHex);
        return new THREE.ShaderMaterial({
          uniforms: waterUniforms,
          vertexShader: [
            'uniform float uTime;',
            'varying vec2 vUv;',
            'varying float vWave;',
            'void main() {',
            '  vUv = uv;',
            '  vec3 p = position;',
            '  float w = sin(p.x * 1.4 + uTime * 2.2) * 0.06 + cos(p.y * 1.1 - uTime * 1.7) * 0.05;',
            '  p.z += w;',
            '  vWave = w;',
            '  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);',
            '}'
          ].join('\n'),
          fragmentShader: [
            'uniform vec3 uDeepColor;',
            'uniform vec3 uShallowColor;',
            'uniform vec3 uFoamColor;',
            'uniform float uTime;',
            'varying vec2 vUv;',
            'varying float vWave;',
            'void main() {',
            '  float shore = smoothstep(0.0, 0.16, vUv.x) * (1.0 - smoothstep(0.84, 1.0, vUv.x));',
            '  vec3 col = mix(uShallowColor, uDeepColor, shore);',
            '  float shimmer = smoothstep(0.03, 0.09, vWave);',
            '  col = mix(col, uFoamColor, shimmer * 0.38);',
            '  float foamEdge = 1.0 - smoothstep(0.0, 0.035, abs(vUv.x - 0.015));',
            '  col = mix(col, uFoamColor, foamEdge * (0.5 + 0.5 * sin(uTime * 3.0 + vUv.y * 40.0)) * 0.55);',
            '  gl_FragColor = vec4(col, 1.0);',
            '}'
          ].join('\n')
        });
      }

          openStoryModal(st.badge, st.title, st.story);

      var chumusonReactionTimer = 0;

      function applyStageAtmosphere(st) {
        var progress = st.stars.length > 0 ? starsCollected / st.stars.length : 1;
        var cTop = new THREE.Color(st.skyTopDim).lerp(new THREE.Color(st.skyTopBright), progress);
        var cBot = new THREE.Color(st.skyBotDim).lerp(new THREE.Color(st.skyBotBright), progress);
        var cFog = new THREE.Color(st.fogDim).lerp(new THREE.Color(st.fogBright), progress);
        skyUniforms.topColor.value.copy(cTop);
        skyUniforms.bottomColor.value.copy(cBot);
        scene.background.copy(cTop);
        scene.fog.color.copy(cFog);
        scene.fog.near = 11 + progress * 7;
        scene.fog.far = 42 + progress * 22;
        sunLight.intensity = 0.95 + progress * 0.45;
      }

      function clearStageStars() {
        stageStars.forEach(function (item) {
          scene.remove(item.mesh);
        });
        stageStars = [];
      }

      function syncStoryUI() {
        var dots = storyDotsEl.querySelectorAll('.story-dot');
        dots.forEach(function (dot, i) {
          dot.classList.remove('done', 'current');
          if (storyCompleted || i < storyStageIdx) dot.classList.add('done');
          else if (i === storyStageIdx) dot.classList.add('current');
        });
        if (storyCompleted) {
          starCounterEl.textContent = '★ 3/3';
          storyTextEl.textContent = 'סוף טוב, טחינה בשפע!';
          storyReplayBtn.classList.add('visible');
        } else {
          var st = STORY_STAGES[storyStageIdx];
          starCounterEl.textContent = '★ ' + starsCollected + '/' + st.stars.length;
          storyTextEl.textContent = st.text;
          storyReplayBtn.classList.remove('visible');
        }

      function loadStoryStage(idx, showModal) {
        storyStageIdx = idx;
        storyCompleted = false;
        starsCollected = 0;
        chumusonReactionTimer = 0;
        clearStageStars();

        var st = STORY_STAGES[idx];
        st.stars.forEach(function (pos) {
          var mesh = createStarMesh(st.color);
          mesh.position.copy(pos);
          scene.add(mesh);
          stageStars.push({ mesh: mesh, basePos: pos.clone(), collected: false });
        });

        captiveGroup.position.copy(st.cagePos);
        crumbKingGroup.position.copy(st.kingPos);
        crumbKingGroup.visible = true;
        setKingCostume(st.env);
        finaleBenchGroup.visible = false;
        flyingCrumbs.forEach(function (fc) { scene.remove(fc.mesh); });
        flyingCrumbs = [];
        kingHat.rotation.z = 0.18;
        shadowCage.visible = true;
        cpMouth.visible = true;
        cpHappyGroup.visible = false;
        chickpeaBody.rotation.set(0, 0, 0);
        chickpeaBody.scale.set(1, 1, 1);

        var envBtnsAll = document.querySelectorAll('[data-env]');
        envBtnsAll.forEach(function (b) {
          b.classList.toggle('env-active', b.dataset.env === st.env);

        syncStoryUI();
        if (showModal) {
          openStoryModal(st.badge, st.title, st.story);
        }

      // =========================================================
      // 8C. LIFT, DRAG & THROW PHYSICS + RAYCASTING
      // =========================================================
      var raycaster = new THREE.Raycaster();
      var pointerDownPos = { x: 0, y: 0 };
      var pointerDownTime = 0;

      var isGrabbing = false;
      var isThrown = false;
      var charVel = new THREE.Vector3(0, 0, 0);
      var grabPlane = new THREE.Plane();
      var grabOffset = new THREE.Vector3();
      var grabIntersect = new THREE.Vector3();
      var throwHistory = [];

      function getNDC(clientX, clientY) {
        return new THREE.Vector2(
          (clientX / window.innerWidth) * 2 - 1,
          -(clientY / window.innerHeight) * 2 + 1
        );
      }

      renderer.domElement.addEventListener('pointerdown', function (e) {
        ensureAudio();
        pointerDownPos.x = e.clientX;
        pointerDownPos.y = e.clientY;
        pointerDownTime = performance.now();

        raycaster.setFromCamera(getNDC(e.clientX, e.clientY), camera);
        var hits = raycaster.intersectObject(characterRoot, true);
        if (hits.length > 0) {
          isGrabbing = true;
          isThrown = false;
          charVel.set(0, 0, 0);
          if (controls && controls.enabled !== undefined) controls.enabled = false;

          var camDir = new THREE.Vector3();
          camera.getWorldDirection(camDir);
          grabPlane.setFromNormalAndCoplanarPoint(camDir.negate(), hits[0].point);
          grabOffset.copy(characterRoot.position).sub(hits[0].point);
          throwHistory = [{ pos: characterRoot.position.clone(), t: performance.now() }];
          jellyVelY = 2.8;
          playBoing(280);
        }
      });

      renderer.domElement.addEventListener('pointermove', function (e) {
        if (!isGrabbing) return;
        raycaster.setFromCamera(getNDC(e.clientX, e.clientY), camera);
        if (raycaster.ray.intersectPlane(grabPlane, grabIntersect)) {
          var nextPos = grabIntersect.add(grabOffset);
          nextPos.x = THREE.MathUtils.clamp(nextPos.x, -3.2, 3.2);
          nextPos.y = THREE.MathUtils.clamp(nextPos.y, 0.25, 3.8);
          nextPos.z = THREE.MathUtils.clamp(nextPos.z, -3.2, 3.2);
          characterRoot.position.copy(nextPos);
          var now = performance.now();
          throwHistory.push({ pos: nextPos.clone(), t: now });
          if (throwHistory.length > 5) throwHistory.shift();
        }
      });

      function findInteractRoot(obj) {
        var cur = obj;
        while (cur) {
          if (cur.userData && cur.userData.interactType) return cur;
          cur = cur.parent;
        }
        return null;
      }

      renderer.domElement.addEventListener('pointerup', function (e) {
        if (isGrabbing) {
          isGrabbing = false;
          if (controls && controls.enabled !== undefined) controls.enabled = true;

          if (throwHistory.length >= 2) {
            var first = throwHistory[0];
            var last = throwHistory[throwHistory.length - 1];
            var dtSec = Math.max((last.t - first.t) / 1000, 0.016);
            var vx = (last.pos.x - first.pos.x) / dtSec;
            var vy = (last.pos.y - first.pos.y) / dtSec;
            var vz = (last.pos.z - first.pos.z) / dtSec;
            var speed = Math.hypot(vx, vy, vz);
            if (speed > 0.7 || characterRoot.position.y > 0.15) {
              charVel.set(vx, vy, vz).clampLength(0, 14);
              isThrown = true;
              if (speed > 2.2) playThrowWhoosh();
              return;
            }
          }
          triggerJellyImpulse(4.0, 0.2, 0.2);
          return;
        }

        var dx = e.clientX - pointerDownPos.x;
        var dy = e.clientY - pointerDownPos.y;
        var dist = Math.hypot(dx, dy);
        var dt = performance.now() - pointerDownTime;
        if (dist < 14 && dt < 300) {
          raycaster.setFromCamera(getNDC(e.clientX, e.clientY), camera);
          var hitsChar = raycaster.intersectObject(characterRoot, true);
          if (hitsChar.length > 0) return;

          // Check pebbles first
          var hitsPebbles = raycaster.intersectObjects(trackPebbles, false);
          if (hitsPebbles.length > 0) {
            var peb = hitsPebbles[0].object;
            peb.userData.vy = 2.6 + Math.random() * 1.2;
            peb.userData.rotVel = (Math.random() - 0.5) * 14;
            spawnDust(peb.position.x, 0.08, peb.position.z, 5, 0.3);
            playStoneTap();
            return;
          }

          // Check environment objects
          var hitsEnv = raycaster.intersectObjects(interactiveEnvObjects.concat([crumbKingGroup]), true);
          if (hitsEnv.length > 0) {
            var hit = hitsEnv[0];
            var target = findInteractRoot(hit.object);
            if (target) {
              var type = target.userData.interactType;
              if (type === 'water') {
                spawnWaterRipple(hit.point.x, hit.point.y, hit.point.z);
                playWaterPlop();
              } else if (type === 'palm' || type === 'shrub') {
                target.userData.swayVel += (Math.random() > 0.5 ? 1 : -1) * 4.5;
                spawnDust(hit.point.x, hit.point.y, hit.point.z, 4, 0.35);
                playLeafRustle();
              } else if (type === 'pebble') {
                target.userData.vy = 2.4;
                target.userData.rotVel = 8;
                spawnDust(target.position.x, 0.2, target.position.z, 6, 0.45);
                playStoneTap();
              } else if (type === 'cat') {
                target.userData.swayVel = 6.0;
                spawnSparkles(target.position.x, 0.5, target.position.z, '#fdba74');
                playMeow();
              } else if (type === 'duck') {
                target.userData.swayVel = 7.0;
                spawnWaterRipple(target.position.x, 0.08, target.position.z);
                playQuack();
              } else if (type === 'ibex') {
                target.userData.swayVel = 6.5;
                spawnDust(target.position.x, 0.35, target.position.z, 5, 0.3);
                playBoing(210);
              } else if (type === 'king') {
                target.userData.wobbleVel = 6.5;
                spawnSparkles(target.position.x, 0.9, target.position.z, '#f59e0b');
                playBoing(190);
              } else if (type === 'kotel') {
                spawnSparkles(hit.point.x, hit.point.y, hit.point.z, '#fde68a');
                playStoneTap();
                if (!dovesTriggered) {
                  dovesTriggered = true;
                  kotelDoves.forEach(function (dv) { dv.userData.vy = 2.6 + Math.random() * 1.2; });
                  playDoveFlutter();
                }
              } else if (type === 'boat') {
                target.userData.swayVel += 4.2;
                spawnWaterRipple(target.position.x, 0.04, target.position.z);
                playBellChime(740);
              } else if (type === 'clocktower') {
                target.userData.swayVel += 2.2;
                spawnSparkles(target.position.x, 5.2, target.position.z, '#fef08a');
                playBellChime(523.25);
              } else if (type === 'stone') {
                target.userData.swayVel += 2.6;
                spawnDust(hit.point.x, hit.point.y, hit.point.z, 6, 0.45);
                playStoneTap();
              }
              return;
            }
          }

          // Check sandy track or ground -> hop/dash character toward tap!
          var hitsGround = raycaster.intersectObjects([trackMesh, groundPlane], false);
          if (hitsGround.length > 0) {
            var gp = hitsGround[0].point;
            spawnDust(gp.x, 0.08, gp.z, 6, 0.4);
            playSoftStep();
            var tx = THREE.MathUtils.clamp(gp.x, -2.8, 2.8);
            var tz = THREE.MathUtils.clamp(gp.z, -2.8, 2.8);
            charVel.set((tx - characterRoot.position.x) * 2.4, 3.6, (tz - characterRoot.position.z) * 2.4);
            isThrown = true;
            lookTargetX = THREE.MathUtils.clamp(gp.x * 0.28, -0.45, 0.45);
            lookTimer = 0.75;
            return;
          }

          // Check sky background tap -> breeze gust!
          var hitsSky = raycaster.intersectObject(skyDome, false);
          if (hitsSky.length > 0) {
            windBoost = 1.6;
            interactiveEnvObjects.forEach(function (obj) {
              if (obj.userData && (obj.userData.interactType === 'palm' || obj.userData.interactType === 'shrub')) {
                obj.userData.swayVel += 3.2;
              }
            });
            playLeafRustle();
          }
        }
      });

      // =========================================================
      // 9. ICON-ONLY UI CONTROLS
      // =========================================================
      var modeButtons = [
        document.getElementById('btn-mode-run'),

      function setMode(nextMode) {

      var ENV_LABELS = {

        masada: 'מצדה • מדבר יהודה',
        kinneret: 'הכנרת • הגליל',
