<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>פלאפלוצ׳יק וחומוסון: המסע להצלת הפיתה הגדולה</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%239c4e18'/><circle cx='38' cy='40' r='5' fill='%23fff'/><circle cx='62' cy='40' r='5' fill='%23fff'/></svg>" />
</head>
<body>
  <div id="canvas-container"></div>
  <div id="location-toast" class="location-toast" aria-live="polite"></div>
  <div id="transition-curtain" class="transition-curtain"></div>

  <div id="story-modal-backdrop" class="story-modal-backdrop">
    <div class="story-card">
      <div class="story-card-badge" id="story-card-badge"></div>
      <div class="story-card-title" id="story-card-title"></div>
      <div class="story-card-body" id="story-card-body"></div>
      <button class="story-card-btn" id="btn-story-go" aria-label="Continue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="6 4 20 12 6 20 6 4"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="story-pill" class="story-pill" aria-live="polite">
    <div class="story-dots" id="story-dots">
      <span class="story-dot current"></span>
      <span class="story-dot"></span>
      <span class="story-dot"></span>
      <span class="story-dot"></span>
    </div>
    <div class="star-counter" id="star-counter">★ 0/3</div>
    <div class="stage-timer" id="stage-timer" title="זמן שלב">⏱️ 00:00</div>
    <div class="sesame-counter" id="sesame-counter" title="שומשומים שנאספו">🌾 0</div>
    <div class="story-text" id="story-text"></div>
    <button class="story-replay-btn" id="btn-story-replay" aria-label="Replay Rescue Story" title="Replay">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
    </button>
  </div>

  <!-- Top Bar: Israeli Locations (left) + Sound & Camera Reset (right) -->
  <div class="hud-top">
    <div class="pill-bar" role="group" aria-label="Locations">
      <!-- 1. Jerusalem / Western Wall (Kotel) -->
      <button class="icon-btn" id="btn-env-kotel" data-env="kotel" aria-label="Western Wall Jerusalem" title="Western Wall, Jerusalem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="1.5"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
          <line x1="3" y1="15" x2="21" y2="15"/>
          <line x1="9" y1="5" x2="9" y2="10"/>
          <line x1="15" y1="10" x2="15" y2="15"/>
          <line x1="10" y1="15" x2="10" y2="19"/>
        </svg>
      </button>

      <!-- 2. Masada (Desert Fortress Mesa) -->
      <button class="icon-btn" id="btn-env-masada" data-env="masada" aria-label="Masada" title="Masada, Judean Desert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 19l5-10h10l5 10H2z"/>
          <path d="M7 9l2 3h6l2-3"/>
          <circle cx="18" cy="5" r="2"/>
        </svg>
      </button>

      <!-- 3. Sea of Galilee (Kinneret) -->
      <button class="icon-btn" id="btn-env-kinneret" data-env="kinneret" aria-label="Sea of Galilee" title="Sea of Galilee (Kinneret)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 15c2-1.5 4-1.5 6 0s4 1.5 6 0 4-1.5 6 0"/>
          <path d="M3 19c2-1.5 4-1.5 6 0s4 1.5 6 0 4-1.5 6 0"/>
          <path d="M12 4v3"/>
          <path d="M6.5 6.5l2 2"/>
          <path d="M17.5 6.5l-2 2"/>
          <path d="M7 12a5 5 0 0 1 10 0"/>
        </svg>
      </button>

      <!-- 4. Old Jaffa / Tel Aviv Coast -->
      <button class="icon-btn env-active" id="btn-env-jaffa" data-env="jaffa" aria-label="Old Jaffa Coast" title="Old Jaffa &amp; Coast">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20V9"/>
          <path d="M12 9c-3-3-7-2-8 1 2.5-.5 5 .5 8-1z"/>
          <path d="M12 9c3-3 7-2 8 1-2.5-.5-5 .5-8-1z"/>
          <path d="M12 9c-2-4-5-5-6-5 2 1 4 2.5 6 5z"/>
          <path d="M12 9c2-4 5-5 6-5-2 1-4 2.5-6 5z"/>
          <path d="M5 20h14"/>
        </svg>
      </button>
    </div>

    <div class="pill-bar" role="group" aria-label="Utilities">
      <!-- Sound Toggle -->
      <button class="icon-btn" id="btn-sound" aria-label="Toggle Sound" title="Sound">
        <svg id="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
        <svg id="icon-sound-off" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <line x1="23" y1="9" x2="17" y2="15"/>
          <line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
      </button>

      <!-- Story / Lore -->
      <button class="icon-btn" id="btn-story-info" aria-label="Story" title="Story">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </button>

      <!-- Reset Camera -->
      <button class="icon-btn" id="btn-reset-cam" aria-label="Reset Camera" title="Reset Camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Bottom Bar: Motion Modes (Run, Sit, Roll, Jump) -->
  <div class="hud-bottom">
    <div class="pill-bar" role="group" aria-label="Motion Modes">
      <!-- Run -->
      <button class="icon-btn active" id="btn-mode-run" data-mode="run" aria-label="Run on Track" title="Run">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="13" cy="4.5" r="2"/>
          <path d="M10 9.5l3-1.5 3.5 3 2.5-.5"/>
          <path d="M13 8l-2 5.5-4.5 2"/>
          <path d="M11 13.5l3.5 2.5-1 5"/>
          <path d="M7 9.5l3 0"/>
        </svg>
      </button>

      <!-- Sit -->
      <button class="icon-btn" id="btn-mode-sit" data-mode="sit" aria-label="Sit on Ground" title="Sit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="5" r="2"/>
          <path d="M9 8v6h6l2 5"/>
          <path d="M9 11l4 1"/>
          <line x1="4" y1="19" x2="20" y2="19"/>
        </svg>
      </button>

      <!-- Roll -->
      <button class="icon-btn" id="btn-mode-roll" data-mode="roll" aria-label="Roll" title="Roll">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="7"/>
          <path d="M12 5a7 7 0 0 1 6.5 4.5"/>
          <polyline points="19 6 19 10 15 10"/>
          <circle cx="10.5" cy="11" r="0.8" fill="currentColor"/>
          <circle cx="14" cy="11" r="0.8" fill="currentColor"/>
        </svg>
      </button>

      <!-- Jump / Bounce -->
      <button class="icon-btn" id="btn-jump" aria-label="Jump" title="Jump">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 17V5"/>
          <polyline points="7 10 12 5 17 10"/>
          <path d="M6 20h12"/>
        </svg>
      </button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
